    tools: &hermes_tools
    - type: function
      function:
        name: clarify
        description: 'Ask the user one or more questions when you need a decision, clarification, or feedback before proceeding.
          Pass every question in `questions` (1-5 entries) — a single question is a one-entry array, and several INDEPENDENT
          questions belong in ONE call (one form beats a chain of clarify calls; if one answer would change another question,
          ask separately). Per question: single-select (up to 4 choices — put your recommended option FIRST, the UI marks
          it ''(Recommended)'' and auto-appends an ''Other'' free-text row), multi-select (multi_select=true), or open-ended
          (omit choices). Options go ONLY in `choices`, never enumerated inside the question text (choices render as pickable
          rows; options written into the question are dead prose the user can''t click). Result: {responses: [...], outcome}
          in question order. Each response has status answered, skipped or unanswered (user_response is null unless answered);
          outcome is submitted, cancelled, timed_out or undelivered, with a notice saying why when the wait ended without
          a submit. Prefer deciding low-stakes questions yourself; don''t use this for dangerous-command confirmation (the
          terminal tool handles that).'
        parameters:
          type: object
          properties:
            questions:
              type: array
              minItems: 1
              maxItems: 5
              description: 'The question(s). Each: question text (options excluded), optional choices (recommended first;
                omit for free-text), optional multi_select. Responses come back in question order with the question text echoed.'
              items:
                type: object
                properties:
                  question:
                    type: string
                  choices:
                    type: array
                    items:
                      type: string
                    maxItems: 4
                  multi_select:
                    type: boolean
                required:
                - question
          required:
          - questions
    - type: function
      function:
        name: delegate_task
        description: |-
          Spawn subagents in isolated contexts; each gets its own conversation, terminal session, and toolset, and only its final summary returns to you. Pass every task in `tasks` — one entry spawns one subagent, several run in parallel (limit in the tasks description).

          Sessions without a later-result consumer (including one-shot CLI and cron) join parallel children and return results in this tool call. Otherwise runs in the background: dispatch returns live transcript paths and results re-enter as a new message when subagents finish (one message per call). Background results are delivered only BETWEEN your turns: finish whatever does not depend on them, then give a one-line status and END YOUR TURN. Never wait or poll on transcripts, artifact files, or CI for a child. While children run, `action` (list/steer/stop) controls them live.

          USE FOR: reasoning-heavy subtasks, work that would flood your context, or independent parallel workstreams.
          DO NOT USE FOR (use these instead):
          - Mechanical multi-step work with no reasoning needed -> execute_code
          - A single tool call -> call the tool directly
          - Tasks needing user interaction -> subagents cannot ask questions
          - Durable work that must survive this session -> cronjob or terminal(background=True, notify=True); /stop, /new, or process exit halts running subagents (whole tree); each returns an 'interrupted' completion with partial output.

          RULES:
          - Children know nothing of this conversation: pass everything needed via 'context', including any required output language, tone, or style (e.g. "respond in Chinese").
          - Child summaries are SELF-REPORTS, not verified facts: a child claiming "uploaded successfully" or "file written" may be wrong. For external side effects (uploads, remote writes, publishing), require a verifiable handle (URL, ID, absolute path) and verify it yourself before telling the user the operation succeeded.
          - Children cannot close tracked work: a child asked to close it returns findings instead; the parent applies the transition.
          - Children cannot call delegate_task, clarify, memory, or cronjob.
          - Children inherit the parent model unless pinned via delegation.provider / delegation.model in config.yaml.
        parameters:
          type: object
          properties:
            tasks:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  goal:
                    type: string
                    description: What this subagent should accomplish. Be specific and self-contained — it knows nothing about
                      your conversation history.
                  context:
                    type: string
                    description: 'Background THIS child needs: file paths, error messages, constraints. Each child sees only
                      its own context — repeat shared background in every task that needs it.'
                  output_schema:
                    type: object
                    description: Optional JSON Schema this child's final answer must validate against (told to the child up
                      front; parent validates with one bounded correction retry; result gains schema_valid, plus schema_errors
                      on failure — the child's raw text is still returned as summary, never discarded). Keep it forgiving
                      — require only fields you will read.
                    properties: {}
                    required: []
                  images:
                    type: array
                    items:
                      type: string
                    description: 'Optional images this child must SEE (max 8): local file paths or http(s) URLs — e.g. a screenshot
                      the user sent, a design mock, a chart. Vision-capable children receive the pixels on their first turn;
                      non-vision children get path hints for vision_analyze. Text files do NOT belong here — put paths in
                      ''context'' instead.'
                required:
                - goal
              description: The task(s), up to 10 in parallel for this user (set via delegation.max_concurrent_children). Each
                entry spawns one subagent with isolated context and terminal session; a single task is a one-entry array.
                Required when spawning.
            action:
              type: string
              enum:
              - spawn
              - list
              - steer
              - stop
              description: 'Default ''spawn''. Live control of running children: ''list'' = ids/goals/status/transcripts;
                ''steer'' = queue course-correction text into one child (subagent_id + message) without stopping it; ''stop''
                = end one child early (subagent_id; partial result still returns). Control actions return immediately; goal/tasks
                are ignored unless spawning.'
            subagent_id:
              type: string
              description: Target for action='steer'/'stop' (ids from the spawn response or action='list').
            message:
              type: string
              description: 'For action=''steer'': the course correction, appended to the child''s next tool result mid-run.
                Be directive and specific.'
          required: []
    - type: function
      function:
        name: execute_code
        description: |-
          Run Python that calls Hermes tools programmatically. Use when you need 3+ tool calls with logic between them: filtering/reducing large outputs before they enter context, branching, or loops (N pages/files, retry on failure). Use normal tool calls for single calls, results you must reason over in full, or anything needing user interaction.

          Calls run in a persistent session kernel: variables, imports, and loaded data survive across execute_code calls, so build on earlier work instead of re-loading it. A timed-out or interrupted call loses that state.

          Available via `from hermes_tools import ...`:

            read_file(path: str, offset: int = 1, limit: int = 2000) -> dict
              Lines are 1-indexed. Returns {"content": "...", "total_lines": N}
            write_file(path: str, content: str) -> dict
              Always overwrites the entire file; an existing file must be read_file'd first or the write is refused.
            search_files(pattern: str, target="content", path=".", file_glob=None, limit=50, order="discovery") -> dict
              target: "content" (search inside files) or "files" (find files by name). Returns {"matches": [...]}
            patch(path: str, old_string: str, new_string: str, replace_all: bool = False) -> dict
              Replaces old_string with new_string in the file.
            terminal(command: str, timeout=None, workdir=None) -> dict
              Foreground only (no background/pty). Returns {"output": "...", "exit_code": N}

          Limits: 5-minute timeout, max 50 tool calls per call. Stdout over 50KB shows head/tail inline; the FULL text is auto-saved to a file whose path rides in the result.

          Scripts run in the session's working directory. Interpreter: the project's activated venv/conda python when one is active (VIRTUAL_ENV/CONDA_PREFIX — matches terminal()); otherwise Hermes's own python (the common case — stdlib plus Hermes's deps; check `import x` before relying on project packages).

          Helpers require imports: `from hermes_tools import json_parse, shell_quote, retry`. json_parse(text) — tolerant json.loads for terminal() output; shell_quote(s) — shlex.quote for dynamic shell args; retry(fn, max_attempts=3, delay=2) — exponential backoff.
        parameters:
          type: object
          properties:
            code:
              type: string
              description: Python code to execute. Import tools with `from hermes_tools import terminal, ...` and print your
                final result to stdout.
            reset:
              type: boolean
              description: Discard the kernel's persistent state and start fresh before running this code.
          required:
          - code
    - type: function
      function:
        name: memory
        description: |-
          Save durable facts to persistent memory that survive across sessions. Memory is injected into every future turn, so keep entries compact and high-signal.

          HOW: make ALL your changes in ONE call via an 'operations' array (each item: {action, content?, old_text?}). The batch applies atomically and the char limit is checked only on the FINAL result — so a single call can remove/replace stale entries to free room AND add new ones, even when an add alone would overflow. The response reports current/limit chars and confirms completion; one batch call finishes the update, so don't repeat it. Use the bare action/content/old_text fields only for a single lone change.

          WHEN: only for facts that apply to EVERY session regardless of task: who the user is, stable environment facts, standing conventions with no task home. Anything learned while doing a task (procedures, pitfalls, and the user's preferences and corrections for that kind of work) belongs in the task's skill via skill_manage, where it loads only when relevant; memory is injected into every turn and must stay small.

          IF FULL: an add is rejected with the current entries shown. Reissue as ONE batch that removes or shortens enough stale entries and adds the new one together.

          TARGETS: 'user' = who the user is (name, role, preferences, style). 'memory' = your notes (environment, conventions, tool quirks, lessons).

          SKIP: trivial/obvious info, easily re-discovered facts, raw data dumps, task progress, completed-work logs, temporary TODO state (use session_search for those). Reusable procedures belong in a skill, not memory.
        parameters:
          type: object
          properties:
            action:
              type: string
              enum:
              - add
              - replace
              - remove
              description: The action to perform (single-op shape). Omit when using 'operations'.
            target:
              type: string
              enum:
              - memory
              - user
              description: 'Which memory store: ''memory'' for personal notes, ''user'' for user profile.'
            content:
              type: string
              description: 'The entry content. Required for ''add'' and ''replace''. For ''replace'' it is the COMPLETE new
                entry text: the whole matched entry is overwritten, so include everything you want to keep. Alias: ''new_text''
                is also accepted (same full-entry meaning).'
            old_text:
              type: string
              description: 'REQUIRED for ''replace'' and ''remove'' (single-op shape): a short unique substring IDENTIFYING
                the existing entry to modify -- it locates the entry, it is not spliced out. Omit only for ''add''.'
            new_text:
              type: string
              description: 'Alias for ''content'' (single-op shape): the COMPLETE new entry for ''replace'', not a patch of
                old_text. If both are set, ''content'' wins.'
            operations:
              type: array
              description: 'Batch shape: a list of operations applied atomically in one call against the final char budget.
                Preferred when making multiple changes or consolidating to make room. Each item is {action, content?, old_text?}.'
              items:
                type: object
                properties:
                  action:
                    type: string
                    enum:
                    - add
                    - replace
                    - remove
                  content:
                    type: string
                    description: 'Entry content for add/replace. For replace, the COMPLETE new entry (whole entry is overwritten).
                      Alias: ''new_text''.'
                  new_text:
                    type: string
                    description: Alias for 'content' in a batch op.
                  old_text:
                    type: string
                    description: Substring identifying the entry for replace/remove.
                required:
                - action
          required:
          - target
    - type: function
      function:
        name: patch
        description: Targeted find-and-replace edits in files. Use this instead of sed/awk in terminal. Uses fuzzy matching
          (9 strategies) so minor whitespace/indentation differences won't break it. Returns a unified diff. Auto-runs syntax
          checks after editing. Finds a unique string and replaces it.
        parameters:
          type: object
          properties:
            path:
              type: string
              description: File path to edit.
            old_string:
              type: string
              description: Exact text to find and replace. Must be unique in the file unless replace_all=true. Include surrounding
                context lines to ensure uniqueness.
            new_string:
              type: string
              description: Changed replacement text; it must differ from old_string. Pass empty string '' to delete the matched
                text.
            replace_all:
              type: boolean
              description: 'Replace all occurrences instead of requiring a unique match (default: false)'
              default: false
          required:
          - path
          - old_string
          - new_string
    - type: function
      function:
        name: read_file
        description: 'Read a text file with line numbers and pagination. Use this instead of cat/head/tail in terminal. Output
          format: ''LINE_NUM|CONTENT''. Suggests similar filenames if not found. Use offset and limit for large files. Reads
          exceeding ~100K characters are truncated on a line boundary and return a next_offset; continue with offset to read
          the rest. Documents auto-extract to readable text: .ipynb, Office (.docx/.xlsx/.pptx and legacy .doc/.ppt/.xls),
          PDF (text layer), OpenDocument, RTF, EPUB, SQLite (.db/.sqlite: schema, row counts, first rows). Cannot read images/binary
          — use vision_analyze for images.'
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Path to the file to read (absolute, relative, or ~/path)
            offset:
              type: integer
              description: 'Line number to start reading from (1-indexed, default: 1)'
              default: 1
              minimum: 1
            limit:
              type: integer
              description: 'Maximum number of lines to read (default: 2000, max: 2000). Reads are additionally capped at a
                ~100K-character budget with a next_offset continuation.'
              default: 2000
              maximum: 2000
          required:
          - path
    - type: function
      function:
        name: search_files
        description: |-
          Search file contents or find files by name. Use this instead of grep/rg/find/ls in terminal. Ripgrep-backed, faster than shell equivalents. On macOS, broad searches above the user home automatically skip TCC-protected folders (Desktop, Documents, Downloads, Library, Movies, Music, Pictures); target one directly when access is intentional.

          Content search (target='content'): Regex search inside files. Output modes: full matches with line numbers, file paths only, or match counts.

          File search (target='files'): Find files by glob pattern (e.g., '*.py', '*config*'). Also use this instead of ls. Discovery order is the fast bounded default; exact global newest-first order is an explicit opt-in and may scan the full tree.
        parameters:
          type: object
          properties:
            pattern:
              type: string
              description: Regex pattern for content search, or glob pattern (e.g., '*.py') for file search
            target:
              type: string
              enum:
              - content
              - files
              description: '''content'' searches inside file contents, ''files'' searches for files by name'
              default: content
            path:
              type: string
              description: 'Directory or file to search in (default: current working directory)'
              default: .
            file_glob:
              type: string
              description: Filter files by pattern in grep mode (e.g., '*.py' to only search Python files)
            limit:
              type: integer
              description: 'Maximum number of results to return (default: 50)'
              default: 50
            offset:
              type: integer
              description: 'Skip first N results for pagination (default: 0)'
              default: 0
            order:
              type: string
              enum:
              - discovery
              - modified
              description: 'File-search order: ''discovery'' is fast bounded traversal order; ''modified'' is exact global
                newest-first and may scan the full tree; ignored for content'
              default: discovery
            output_mode:
              type: string
              enum:
              - content
              - files_only
              - count
              description: 'Output format for grep mode: ''content'' shows matching lines with line numbers, ''files_only''
                lists file paths, ''count'' shows match counts per file'
              default: content
            context:
              type: integer
              description: Number of context lines before and after each match (grep mode only)
              default: 0
          required:
          - pattern
    - type: function
      function:
        name: skill_manage
        description: 'Create, update, or delete skills — your procedural memory for recurring task types. The call is an operations
          array (a single edit is a list of one); it applies atomically — any failure rolls every touched skill back. Ops:
          create (full SKILL.md; lands in the profile''s skills directory or configured skills.create_dir; must precede that
          skill''s other ops), patch (targeted old_string/new_string fix — preferred; content alone REPLACES the whole file,
          read it via skill_view() first), write_file/remove_file (supporting files), delete (sole op only). Existing skills
          are modified wherever they live. Keep the description''s first 57 chars a self-contained trigger: ''Use when <trigger>.
          <one-line behavior>.'' Write lessons, not logs: imperative rule + why, no PR numbers/dates/incident narration, one
          rule per lesson, references/ named by topic (extend before adding). skill_view() shows format conventions.'
        parameters:
          type: object
          properties:
            operations:
              type: array
              description: Ordered ops; each names its target skill (lowercase, hyphens/underscores, max 64 chars). Each action
                is its own shape; another action's text slot is invalid.
              items:
                anyOf:
                - type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    action:
                      type: string
                      enum:
                      - create
                    content:
                      type: string
                      description: Full SKILL.md text (YAML frontmatter + markdown body).
                    category:
                      type: string
                      description: Optional category subdir (e.g. 'devops').
                  required:
                  - name
                  - action
                  - content
                - type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    action:
                      type: string
                      enum:
                      - patch
                    old_string:
                      type: string
                      description: Text to find (same matching semantics as the patch tool).
                    new_string:
                      type: string
                      description: Replacement; empty string deletes the match.
                    replace_all:
                      type: boolean
                      description: Replace all occurrences (default false).
                    file_path:
                      type: string
                      description: Optional supporting file (write_file's shape); default SKILL.md.
                  required:
                  - name
                  - action
                  - old_string
                  - new_string
                - type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    action:
                      type: string
                      enum:
                      - patch
                    content:
                      type: string
                      description: Full SKILL.md rewrite (REPLACES the whole file; last resort).
                  required:
                  - name
                  - action
                  - content
                - type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    action:
                      type: string
                      enum:
                      - write_file
                    file_path:
                      type: string
                      description: Path RELATIVE to the skill's own directory, e.g. 'references/api.md' — no leading slash,
                        never absolute; first segment references/, templates/, scripts/, or assets/.
                    file_content:
                      type: string
                      description: Full text of the supporting file.
                  required:
                  - name
                  - action
                  - file_path
                  - file_content
                - type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    action:
                      type: string
                      enum:
                      - remove_file
                    file_path:
                      type: string
                      description: Supporting file (write_file's shape).
                  required:
                  - name
                  - action
                  - file_path
                - type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                    action:
                      type: string
                      enum:
                      - delete
                    absorbed_into:
                      type: string
                      description: 'Curator consolidation only: umbrella skill that absorbed this one (must exist).'
                  required:
                  - name
                  - action
          required:
          - operations
    - type: function
      function:
        name: skill_view
        description: Skills allow for loading information about specific tasks and workflows, as well as scripts and templates.
          Load a skill's full content or access its linked files (references, templates, scripts). First call returns SKILL.md
          content plus a 'linked_files' dict showing available references/templates/scripts. To access those, call again with
          file_path parameter.
        parameters:
          type: object
          properties:
            name:
              type: string
              description: The skill name (use skills_list to see available skills). For plugin-provided skills, use the qualified
                form 'plugin:skill' (e.g. 'superpowers:writing-plans').
            file_path:
              type: string
              description: 'OPTIONAL: Path to a linked file within the skill (e.g., ''references/api.md'', ''templates/config.yaml'',
                ''scripts/validate.py''). Omit to get the main SKILL.md content.'
          required:
          - name
    - type: function
      function:
        name: skills_list
        description: List available skills (name + description). Use skill_view(name) to load full content.
        parameters:
          type: object
          properties:
            category:
              type: string
              description: Optional category filter to narrow results
          required: []
    - type: function
      function:
        name: terminal
        description: |
          Execute shell commands. The host OS, shell, and terminal backend are stated in your environment section — write commands for THAT platform. Filesystem, current working directory, and exported environment variables persist between calls.

          Do NOT use cat/head/tail (use read_file), grep/rg/find/ls (use search_files), sed/awk (use patch), or echo/heredoc file creation (use write_file). Reserve terminal for: builds, installs, git, processes, scripts, network, package managers — anything that needs a shell. Output is auto-truncated with the full text saved to a file — never pipe through tail/head to shorten it.
          Environment state persists: activate a virtualenv or export variables once per session, not before every command.

          Foreground (default): returns INSTANTLY when the command finishes, even with a high timeout — set timeout generously for long builds and fixed waits.
          Background: set background=true (returns a session_id) only for commands that must keep running independently after this tool call returns; add notify=true for bounded tasks, leave silent only for servers/daemons that never exit. Do not start sleep, timers, cooldowns, delays, or polling loops with background=true — to wait a fixed time, run the wait as a normal foreground command with a high enough timeout. After starting a server, verify readiness with a health check in a separate call (no blind sleep loops); manage with process(action="poll"/"wait").
          Working directory: use 'workdir' for per-command cwd; when a command changes the session cwd (cd, pushd), trust the result's "cwd" field instead of prefixing every command with 'cd'.
          PTY: pty=true + background=true for interactive CLIs (they hang without a terminal); drive them with process(action="write"/"submit"). Local backend only.
          Persist: background=true, persist_on_release=true keeps the job alive across agent lifecycle cleanup (session end, /new, compression, error recovery, stop-on-max-iterations). Use ONLY for long-running jobs the user explicitly wants to outlive the conversation; the user can still stop it on purpose.
        parameters:
          type: object
          properties:
            command:
              type: string
              description: The shell command to execute
            background:
              type: boolean
              description: 'Run in the background, returning a session_id. Pair with notify=true for anything with a defined
                end (tests, builds, deploys) — without it the process runs silently. Only servers/watchers/daemons that never
                exit should stay silent. Short commands: prefer foreground with a generous timeout.'
              default: false
            timeout:
              type: integer
              description: 'Max seconds to wait (default: 180, foreground max: 600). Returns INSTANTLY when command finishes
                — set high for long tasks, you won''t wait unnecessarily. A foreground timeout above 600s runs the command
                as a tracked background process with notify_on_complete=true instead (the result says so; do not re-run it).'
              minimum: 1
            workdir:
              type: string
              description: Working directory for this command (absolute path). Defaults to the session working directory.
            pty:
              type: boolean
              description: 'With background=true: run in a pseudo-terminal for interactive CLI tools (Codex, Claude Code,
                Python REPL). Local backend only. Default: false.'
              default: false
            notify:
              description: 'With background=true: notify=true fires exactly one notification when the process exits (the right
                choice for nearly every bounded task — builds, tests, deploys). notify=[''pattern'', ...] instead notifies
                when a line matches a pattern — ONLY for one-shot readiness signals on processes that never exit (e.g. [''Application
                startup complete'']); rate-limited and auto-disabled if it over-fires. Omit for silent daemons.'
              anyOf:
              - type: boolean
              - type: array
                items:
                  type: string
            heartbeat:
              type: integer
              minimum: 0
              default: 0
              description: '0 disables. With background=true: also notify every N seconds (positive values are clamped to
                min 60) with the output produced since the last notice; a tick with no new output is skipped. For bounded
                jobs you must react to mid-run (merge trains, full suites, deploys) — never for servers or watchers; implies
                notify=true. Ignored on foreground commands.'
            persist_on_release:
              type: boolean
              default: false
              description: 'With background=true: keep the process alive across agent lifecycle cleanup (session end, /new,
                context compression, error recovery, max-iteration stop). Use ONLY for long-running jobs the user explicitly
                wants to outlive the conversation (overnight batches, watchful daemons); it still dies with the host process,
                and the user (or a later turn via process kill) can stop it on purpose. Default false.'
          required:
          - command
    - type: function
      function:
        name: write_file
        description: 'Write content to a file, completely replacing existing content. Use this instead of echo/cat heredoc
          in terminal. Creates parent directories automatically. OVERWRITES the entire file — use ''patch'' for targeted edits.
          For an EXISTING file, call read_file first: write_file refuses (file untouched) when this task has no current full
          read/write of the file or the file changed on disk since; on refusal, read_file, merge, then retry. Auto-runs syntax
          checks on .py/.json/.yaml/.toml and other linted languages; only NEW errors introduced by this write are surfaced
          (pre-existing errors are filtered out). The result''s verified:true means the on-disk content hash was confirmed
          — do NOT re-read the file to check the write landed.'
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Path to the file to write (will be created if it doesn't exist, overwritten if it does)
            content:
              type: string
              description: Complete content to write to the file
          required:
          - path
          - content
    - type: function
      function:
        name: tool_search
        description: |-
          Search 4 additional tools that are loaded on demand. Takes a list of queries searched in parallel against the same catalog; send one query per distinct capability you need. Queries are keyword searches, not questions: the app or service name plus an action and object, no filler words (`gmail send email`, `nvidia driver status`, not `what's my GPU driver version?`); a word no tool contains makes the query return nothing. Returns matching tool names grouped per query plus a shared map with each tool's description. Follow with `tool_describe` to load full parameter schemas, then `tool_call` to invoke. Tools listed at the top of this system prompt are already available and do not need to be searched.

          Every deferred capability is listed below. If a tool name appears here, do NOT claim it is unavailable — load it with `tool_describe` (skip `tool_search` when you already see the exact name).

          Deferred tool catalog (call schemas via `tool_describe`, invoke via `tool_call`):
          cronjob tools (1):
          - cronjob_manage: Manage scheduled cron jobs: action='create' schedules a job…
          session_search tools (1):
          - session_search: Recall past conversations: search or read old Hermes…
          terminal tools (1):
          - process_manage: Poll, wait on, or kill background terminal processes (from…
          todo tools (1):
          - todo_list: Track a task list for multi-step work (3+ steps).
        parameters:
          type: object
          properties:
            queries:
              type: array
              items:
                type: string
              description: 'Keyword queries, one per capability: app or service name + action + object (e.g. [''github create
                issue'', ''slack send message'', ''gmail fetch emails'']). Not questions or sentences: every word must appear
                in tool text, or the query returns nothing. Searched in parallel; results come back grouped per query. A single
                string is accepted and treated as one query.'
            limit:
              type: integer
              description: Maximum number of matches per query. Defaults to 5 and is clamped to the configured maximum (25
                by default).
          required:
          - queries
    - type: function
      function:
        name: tool_describe
        description: Load the full JSON schemas for tools returned by `tool_search`. Required before `tool_call` if a tool's
          parameters are unknown. Batch every schema you need into one call.
        parameters:
          type: object
          properties:
            names:
              type: array
              items:
                type: string
              description: Exact tool names (as returned by tool_search). A single string is accepted and treated as one name.
          required:
          - names
    - type: function
      function:
        name: tool_call
        description: Invoke deferred tools. Takes `calls`, an array of {name, arguments} — one entry per invocation; a single
          call is an array of one. Independent calls may be batched together. Local entries are split into individual tool
          calls by the agent and follow each tool's concurrency policy. Results are returned in input order. Argument shapes
          match each tool's schema (see `tool_describe`). Policy, hooks, and approvals run as for directly-listed tools.
        parameters:
          type: object
          properties:
            calls:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Exact tool name to invoke.
                  arguments:
                    type: object
                    description: Arguments matching the tool schema.
                required:
                - name
                - arguments
              description: One or more independent deferred tool invocations.
          required:
          - calls
  pi:
    system: &pi_system |-
      You are an expert coding assistant operating inside pi, a coding agent harness. You help users by reading files, executing commands, editing code, and writing new files.

      <tools>
      - read: Read file contents
      - bash: Execute bash commands (ls, grep, find, etc.)
      - edit: Make precise file edits with exact text replacement, including multiple disjoint edits in one call
      - write: Create or overwrite files

      In addition to the tools above, you may have access to other custom tools depending on the project.
      </tools>

      <rules>
      - Use bash for file operations like ls, rg, find
      - Use read to examine files instead of cat or sed.
      - You can inspect PI_* environment variables for current model and session details.
      - Use edit for precise changes (edits[].oldText must match exactly)
      - When changing multiple separate locations in one file, use one edit call with multiple entries in edits[] instead of multiple edit calls
      - Each edits[].oldText is matched against the original file, not after earlier edits are applied. Do not emit overlapping or nested edits. Merge nearby changes into one edit.
      - Keep edits[].oldText as small as possible while still being unique in the file. Do not pad with large unchanged regions.
      - Use write only for new files or complete rewrites.
      - Be concise in your responses
      - Show file paths clearly when working with files
      </rules>

      <docs>
      Pi documentation (read only when the user asks about pi itself, its SDK, extensions, themes, skills, or TUI):
      - Main documentation: /usr/lib/node_modules/@earendil-works/pi-coding-agent/README.md
      - Additional docs: /usr/lib/node_modules/@earendil-works/pi-coding-agent/docs
      - Examples: /usr/lib/node_modules/@earendil-works/pi-coding-agent/examples (extensions, custom tools, SDK)
      - When reading pi docs or examples, resolve docs/... under Additional docs and examples/... under Examples, not the current working directory
      - When asked about: extensions (docs/extensions.md, examples/extensions/), themes (docs/themes.md), skills (docs/skills.md), prompt templates (docs/prompt-templates.md), TUI components (docs/tui.md), keybindings (docs/keybindings.md), SDK integrations (docs/sdk.md), custom providers (docs/custom-provider.md), adding models (docs/models.md), pi packages (docs/packages.md), environment variables (docs/environment-variables.md), MCP servers (docs/mcp.md), codemode scripts and non-LLM models such as classifiers and image models (docs/codemode.md)
      - When working on pi topics, read the docs and examples, and follow .md cross-references before implementing
      - Always read pi .md files completely and follow links to related docs (e.g., tui.md for TUI API details)
      </docs>

      <cwd>
      /repo
      </cwd>
    tools: &pi_tools
    - type: function
      function:
        name: read
        description: Read the contents of a file. Supports text files and images (jpg, png, gif, webp, bmp). Images are sent
          as attachments. For text files, output is truncated to 2000 lines or 50KB (whichever is hit first). Use offset/limit
          for large files. When you need the full file, continue with offset until complete.
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Path to the file to read (relative or absolute)
            offset:
              type: number
              description: Line number to start reading from (1-indexed)
            limit:
              type: number
              description: Maximum number of lines to read
          required:
          - path
    - type: function
      function:
        name: bash
        description: Execute a bash command in the current working directory. Returns stdout and stderr. Output is truncated
          to last 2000 lines or 50KB (whichever is hit first). If truncated, full output is saved to a temp file. Optionally
          provide a timeout in seconds.
        parameters:
          type: object
          properties:
            command:
              type: string
              description: Shell command to execute
            timeout:
              type: number
              description: Timeout in seconds (optional, no default timeout)
          required:
          - command
    - type: function
      function:
        name: edit
        description: Edit a single file using exact text replacement. Every edits[].oldText must match a unique, non-overlapping
          region of the original file. If two changes affect the same block or nearby lines, merge them into one edit instead
          of emitting overlapping edits. Do not include large unchanged regions just to connect distant changes.
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Path to the file to edit (relative or absolute)
            edits:
              type: array
              description: One or more targeted replacements. Each edit is matched against the original file, not incrementally.
                Do not include overlapping or nested edits. If two changes touch the same block or nearby lines, merge them
                into one edit instead.
              items:
                type: object
                properties:
                  oldText:
                    type: string
                    description: Exact text for one targeted replacement. It must be unique in the original file and must
                      not overlap with any other edits[].oldText in the same call.
                  newText:
                    type: string
                    description: Replacement text for this targeted edit.
                required:
                - oldText
                - newText
          required:
          - path
          - edits
    - type: function
      function:
        name: write
        description: Write content to a file. Creates the file if it doesn't exist, overwrites if it does. Automatically creates
          parent directories.
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Path to the file to write (relative or absolute)
            content:
              type: string
              description: Content to write to the file
          required:
          - path
          - content
  python_repl:
    tools: &python_repl_tools
    - type: function
      function:
        name: Python_REPL
        description: A Python shell. Use this to execute python commands. Input should be a valid python command. If you want
          to see the output of a value, you should print it out with `print(...)`.
        parameters:
          type: object
          properties:
            query:
              type: string
              description: code snippet to run
          required:
          - query
  write_edit:
    system: &write_edit_system You are a coding agent working in the repository at /repo. The only tools are `write` and `edit`;
      there is no shell. Make the change directly with one of them.
    tools: &write_edit_tools
    - type: function
      function:
        name: write
        description: Create or overwrite a file with the given content.
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Absolute file path.
            content:
              type: string
              description: Full file content.
          required:
          - path
          - content
    - type: function
      function:
        name: edit
        description: Replace an exact string in a file with a new string.
        parameters:
          type: object
          properties:
            path:
              type: string
              description: Absolute file path.
            old_string:
              type: string
              description: Exact text to replace.
            new_string:
              type: string
              description: Replacement text.
          required:
          - path
          - old_string
          - new_string
